<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulSworn UI</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <h1>SoulSworn UI</h1>

  <div id="game-container">
    <!-- UI Placeholders - These will be styled with exact positioning -->
    <div id="menu-placeholder" class="placeholder-ui"></div>
    <div id="inspector-placeholder" class="placeholder-ui"></div>
    <div id="d20-placeholder" class="placeholder-ui"></div>
    <div id="logo-placeholder" class="placeholder-ui"></div>
    <div id="turn-timer-placeholder" class="placeholder-ui"></div>
    
    <!-- All other elements (card slots, player hands, story grid, etc.) will be added by JavaScript -->
  </div>

  <!-- Load the UI scripts -->
  <script src="js/uiRenderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
